name: Sync tasks (scheduled)

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:        # ручной запуск

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sphere-tasks
        uses: actions/checkout@v4

      - name: Checkout sphere-tasks
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TASKS_REPO }}
          token: ${{ secrets.TASKS_REPO_TOKEN }}
          path: sphere-tasks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git -C sphere-tasks config user.name "sphere-sync"
          git -C sphere-tasks config user.email "sphere-sync@noreply"

      - name: Run full sync
        env:
          B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}
          B24_GROUP_IDS: ${{ vars.B24_GROUP_IDS }}
          TASKS_REPO_PATH: ${{ github.workspace }}/sphere-tasks
        run: npm run sync
