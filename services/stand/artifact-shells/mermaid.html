<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  #diagram { padding: 24px; width: min(95vw, 1100px); box-sizing: border-box; overflow: auto; }
  #diagram svg { width: 100%; height: auto; max-width: none !important; max-height: 90vh; }
</style>
</head>
<body>
<div id="diagram">Загрузка…</div>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.esm.min.mjs";
const el = document.getElementById("diagram");
const src = await (await fetch("./__SOURCE__", { cache: "no-cache" })).text();
mermaid.initialize({ startOnLoad: false, securityLevel: "strict",
  theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default" });
try {
  const { svg } = await mermaid.render("d", src);
  el.innerHTML = svg;
} catch (err) {
  el.textContent = "Ошибка в диаграмме: " + err.message;
}
</script>
</body>
</html>
