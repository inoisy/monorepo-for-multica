name: Multica tasks MCP image

on:
  pull_request:
    paths: ["mcp/multica-tasks/**", ".github/workflows/multica-tasks-image.yml"]
  push:
    branches: [main]
    paths: ["mcp/multica-tasks/**", ".github/workflows/multica-tasks-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Tests
        run: python3 -IB -m unittest discover -s mcp/multica-tasks/tests -q
      - uses: docker/setup-buildx-action@v3
      # Вход нужен и в PR: сборка тянет бинарь CLI из образа ghcr.io/inoisy/multica-backend
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mcp/multica-tasks
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/multica-tasks-mcp:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=multica-tasks-mcp
          cache-to: type=gha,mode=max,scope=multica-tasks-mcp
